<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="mta-icon.svg">
  <link rel="icon" type="image/png" href="mta-icon.png">
  <link rel="apple-touch-icon" href="mta-icon.png">
  <title>Subway Time — Locating…</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #333;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 360px;
    }

    .icon-wrap {
      width: 48px;
      height: 48px;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 18px;
      font-weight: 500;
      color: #555;
    }

    .error-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .error-box.visible {
      display: flex;
    }

    .error-message {
      font-size: 15px;
      color: #888;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }

    .btn:hover {
      background: #444;
    }

    .btn-secondary {
      background: none;
      color: #888;
      text-decoration: underline;
      font-size: 14px;
      padding: 4px;
    }

    .btn-secondary:hover {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading-state">
      <div class="icon-wrap spinner">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7"></circle>
          <line x1="12" y1="1" x2="12" y2="5"></line>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="1" y1="12" x2="5" y2="12"></line>
          <line x1="19" y1="12" x2="23" y2="12"></line>
          <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
        </svg>
      </div>
      <div class="status" id="status-text" style="margin-top: 16px;">Finding nearest stations…</div>
    </div>

    <div class="error-box" id="error-state">
      <div class="icon-wrap" style="color: #c00;">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="status" style="color: #222;">Location unavailable</div>
      <div class="error-message" id="error-text">Please allow location access so we can find your nearest subway stations.</div>
      <div class="actions">
        <button class="btn" onclick="locate()">Try again</button>
        <a href="/" class="btn-secondary">View default stations</a>
      </div>
    </div>
  </div>

  <script>
    function showError(msg) {
      document.getElementById('loading-state').style.display = 'none';
      const errorBox = document.getElementById('error-state');
      if (msg) document.getElementById('error-text').textContent = msg;
      errorBox.classList.add('visible');
    }

    function locate() {
      document.getElementById('loading-state').style.display = 'block';
      document.getElementById('error-state').classList.remove('visible');

      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async ({ coords }) => {
          try {
            const res = await fetch(`/api/nearest?lat=${coords.latitude}&lon=${coords.longitude}`);
            if (!res.ok) throw new Error('request failed');
            const stations = await res.json();
            if (!stations || !stations.length) throw new Error('No stations found');
            const param = stations.map(s => s.stationId).join(',');
            window.location.replace(`/?station=${param}`);
          } catch (err) {
            showError('Failed to fetch nearest stations. Please check your connection and try again.');
          }
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            showError('Location access was denied. Please allow location permissions in your browser settings to find nearby stations.');
          } else {
            showError('Unable to determine your location. Please try again.');
          }
        },
        { timeout: 10000, maximumAge: 60000 }
      );
    }

    locate();
  </script>
</body>
</html>
